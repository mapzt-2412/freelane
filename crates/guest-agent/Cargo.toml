[package]
name = "freelane-guest-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
libc = "0.2"
freelane-agent-protocol = { path = "../agent-protocol" }
getrandom = "0.4"
arboard = { version = "3", default-features = false }
sha2 = "0.11.1"
cap-std = "4.0.3"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
